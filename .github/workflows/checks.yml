name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eatwhat
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: eatwhat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eatwhat -d eatwhat_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://eatwhat:test-only@localhost:5432/eatwhat_test
      TEST_DATABASE_URL: postgresql://eatwhat:test-only@localhost:5432/eatwhat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check server.js db.js api scripts test README.md package.json vercel.json .github/workflows/checks.yml
      - run: npm run db:init
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
